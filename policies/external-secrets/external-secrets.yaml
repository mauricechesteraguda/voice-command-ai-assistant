apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: voice-command-api-secrets, namespace: platform }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: platform-secrets, kind: SecretStore }
  target: { name: voice-command-api-secrets, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: platform/database-url }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: platform/oidc-client-secret }
