apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: platform-secrets, namespace: platform }
spec:
  provider:
    kubernetes:
      remoteNamespace: platform-system
      server: { caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt } }
      auth: { serviceAccount: { name: external-secrets-reader } }
