apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: { name: platform-control, namespace: argocd }
spec:
  sourceRepos: [https://github.com/mauricechesteraguda/voice-command-ai-assistant.git]
  destinations:
    - { namespace: argocd, server: https://kubernetes.default.svc }
    - { namespace: platform-system, server: https://kubernetes.default.svc }
  clusterResourceWhitelist:
    - { group: '', kind: Namespace }
    - { group: argoproj.io, kind: Application }
    - { group: argoproj.io, kind: ApplicationSet }
  namespaceResourceWhitelist: [{ group: '', kind: ConfigMap }, { group: '', kind: Secret }, { group: '', kind: Service }, { group: '', kind: ServiceAccount }, { group: apps, kind: Deployment }, { group: apps, kind: StatefulSet }, { group: apps, kind: DaemonSet }, { group: batch, kind: Job }, { group: batch, kind: CronJob }, { group: rbac.authorization.k8s.io, kind: Role }, { group: rbac.authorization.k8s.io, kind: RoleBinding }, { group: networking.k8s.io, kind: NetworkPolicy }, { group: networking.k8s.io, kind: Ingress }, { group: autoscaling, kind: HorizontalPodAutoscaler }, { group: policy, kind: PodDisruptionBudget }, { group: monitoring.coreos.com, kind: ServiceMonitor }]
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: { name: platform, namespace: argocd }
spec:
  sourceRepos: [https://github.com/mauricechesteraguda/voice-command-ai-assistant.git]
  destinations:
    - { namespace: platform, server: https://kubernetes.default.svc }
    - { namespace: platform-dev, server: https://kubernetes.default.svc }
    - { namespace: platform-staging, server: https://kubernetes.default.svc }
    - { namespace: platform-prod, server: https://kubernetes.default.svc }
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: '', kind: ConfigMap }
    - { group: '', kind: Secret }
    - { group: '', kind: Service }
    - { group: '', kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: apps, kind: StatefulSet }
    - { group: apps, kind: DaemonSet }
    - { group: batch, kind: Job }
    - { group: batch, kind: CronJob }
    - { group: rbac.authorization.k8s.io, kind: Role }
    - { group: rbac.authorization.k8s.io, kind: RoleBinding }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: monitoring.coreos.com, kind: ServiceMonitor }
  syncWindows:
    - { kind: deny, schedule: '0 0 * * 0', duration: 24h, applications: [platform-root, platform-app, kind-platform], manualSync: true }
