apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: platform-app, namespace: argocd }
spec:
  project: platform
  source: { repoURL: https://github.com/mauricechesteraguda/voice-command-ai-assistant.git, targetRevision: main, path: helm/app }
  destination: { server: https://kubernetes.default.svc, namespace: platform }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true, ServerSideApply=true] }
