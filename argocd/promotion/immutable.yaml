apiVersion: batch/v1
kind: Job
metadata: { name: immutable-promotion-gate, namespace: argocd }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gate
          image: alpine:3.20
          command: ["sh", "-c", "case \"$IMAGE\" in *@sha256:*) digest=\"${IMAGE##*@}\"; test \"$digest\" != sha256:$(printf '0%.0s' $(seq 1 64));; *) exit 1;; esac"]
          env: [{ name: IMAGE, value: "" }]
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 50m, memory: 64Mi } }
