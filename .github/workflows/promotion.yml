name: GitOps promotion PR
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: immutable image digest
        required: true
permissions:
  contents: read
  pull-requests: write
jobs:
  promote:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate immutable digest
        run: test "${{ inputs.image_digest }}" = sha256:*
      - name: Open promotion PR
        run: echo "Promotion PR is created by the protected repository automation placeholder"
