nameOverride: voice-command-api
image:
  repository: voice-command-api
  tag: "0.1.0"
  digest: ""
service:
  port: 8000
migration:
  enabled: true
  image: voice-command-api:0.1.0
  hookWeight: "-5"
externalSecrets:
  secretStore: platform-secrets
  keys: [DATABASE_URL, OIDC_CLIENT_SECRET]
probes:
  readinessPath: /v1/health/ready
  livenessPath: /v1/health/live
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
