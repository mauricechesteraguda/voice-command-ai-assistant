apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-app.name" . }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "platform-app.name" . }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "platform-app.name" . }} }
    spec:
      serviceAccountName: voice-command-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: '{{ .Values.image.repository }}@{{ required "image.digest must be an immutable non-zero digest" .Values.image.digest }}'
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: voice-command-api-secrets } }]
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: {{ .Values.probes.readinessPath }}, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: {{ .Values.probes.livenessPath }}, port: http }, periodSeconds: 30 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
