{{- if .Values.migration.enabled }}
# migration-runner applies versioned SQL under an advisory lock.
apiVersion: batch/v1
kind: Job
metadata:
  name: voice-command-migrations
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "{{ .Values.migration.hookWeight }}"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.migration.image }}"
          command: ["python", "-m", "migrations.runner", "--fail"]
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: voice-command-api-secrets, key: DATABASE_URL } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
{{- end }}
