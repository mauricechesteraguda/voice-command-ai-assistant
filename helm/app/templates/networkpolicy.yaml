apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: voice-command-api }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: voice-command-api } }
  policyTypes: [Ingress, Egress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform-system } } }], ports: [{ protocol: TCP, port: 8000 }] }]
  egress: [{ to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform-system } } }], ports: [{ protocol: TCP, port: 5432 }] }]
