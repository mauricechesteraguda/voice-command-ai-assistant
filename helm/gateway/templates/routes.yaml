apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: voice-command-api }
spec:
  parentRefs: [{ name: platform-gateway, sectionName: https }]
  hostnames: [{{ .Values.hostname | quote }}]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: voice-command-api, port: 8000 }]
